      <div class="wrap video-wrap"><div class="video"><div class="play"></div></div><div class="line" style="margin-top:20px;width:60%;height:16px"></div><div class="line s"></div></div>`,

  const SCENES = {
    1: { title: 'A tiny spy family lives in your tabs', sub: 'They walk, climb the edges and hop onto pictures, headings and cards.', page: 'article' },

    const data = { settings: { reactToSearch: false, workEmotes: false, roam: false, scale: 1.6 } };
    window.chrome = window.chrome || {};
    chrome.storage = { local: {
      get(keys, cb) { const out = {}; [].concat(keys).forEach(k => { if (k in data) out[k] = data[k]; }); cb(out); },
      set(obj, cb) { Object.assign(data, obj); cb && cb(); } },

<script>
  const FOREVER = 1e9;
  const M = (id) => CovertCrew.members.get(id);

  // Put a character somewhere and freeze them in an action.
  function pose(id, o) {
    const m = M(id);
    m.endAct();
    m.queue.length = 0;
    m.entering = false;
    m.vx = m.vy = 0;
    m.clinging = false;
    m.grounded = true;
    m.platform = o.on ? document.getElementById(o.on) : null;
    m.x = o.x;
    m.facing = o.facing || 1;
    if (o.cling) {
      m.startCling(o.cling);
      m.y = o.y;
      m.startAct({ name: 'climb', phase: 'hold', t: FOREVER });
    } else if (o.held) {
      m.grounded = false;
      m.setState('held');
      m.el.classList.add('held');
      m.y = o.y;
      setInterval(() => { m.heldVX = o.swing || -500; }, 30);
    } else {
      m.startAct(Object.assign({ name: 'idle' }, o.act, { t: FOREVER }));
    }
    if (o.expr) m.setExpr(o.expr, FOREVER);
    if (o.prop) m.setProp(o.prop);
    if (o.say) m.say(o.say, FOREVER);
    if (o.emote) m.emote(o.emote, FOREVER);
    if (o.hearts) setInterval(() => m.particles(o.hearts, 1), 650);
  }

  function cursor(x, y) {
    const c = document.createElement('div');
    c.className = 'cursor';
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    c.innerHTML = '<svg viewBox="0 0 20 30"><path d="M1 1 L1 23 L6.5 17.5 L10.5 27 L14 25.5 L10 16.5 L18 16.5 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    document.body.appendChild(c);
  }

  const STAGE = {
    1() {
      const hero = document.getElementById('hero').getBoundingClientRect();
      pose('dad', { x: 200, act: { name: 'read' }, emote: '☕' });
      pose('mom', { x: 0, cling: 1, y: 470, expr: 'happy', emote: '💪' });
      pose('kid', { x: hero.left + 340, on: 'hero', act: { name: 'wave' }, say: 'Hi! We live here now!' });
      pose('dog', { x: 700, facing: -1, act: { name: 'sniff' }, emote: '👃' });
    },
    2() {
      pose('dad', { x: 300, facing: 1, expr: 'happy', say: 'Dinner is decided, then.' });
      pose('mom', { x: 470, facing: 1, expr: 'love', emote: '😋' });
      pose('kid', { x: 640, facing: -1, expr: 'excited', say: 'Snack time?!', emote: '🤤' });
      pose('dog', { x: 800, facing: -1, expr: 'love', prop: 'bone', emote: '🍖' });
    },
    3() {
      const todo = document.getElementById('todo').getBoundingClientRect();
      pose('dad', { x: 480, held: true, y: 560, expr: 'surprised', say: 'Put me down!', swing: -900 });
      cursor(474, 560 - M('dad').h * 0.9);
      pose('kid', { x: todo.left + 150, on: 'todo', expr: 'love', hearts: '💗', say: 'More head pats!' });
      cursor(todo.left + 160, todo.top - M('kid').h * 0.75);
      pose('mom', { x: 200, act: { name: 'train' }, say: 'Hi-yah!' });
      pose('dog', { x: 840, facing: -1, act: { name: 'idle' }, expr: 'excited', emote: '❗' });
    },
    4() {
      pose('dad', { x: 300, facing: 1, expr: 'shy', say: 'You look nice today.' });
      pose('mom', { x: 388, facing: -1, expr: 'shy', hearts: '💕' });
      pose('kid', { x: 760, facing: 1, act: { name: 'dance' }, expr: 'excited', emote: '✨' });
      pose('dog', { x: 870, facing: -1, act: { name: 'idle' }, expr: 'excited', emote: '🐾' });
    },
    5() {
      pose('dad', { x: 140, act: { name: 'wave' }, expr: 'happy' });
      pose('mom', { x: 250, expr: 'happy' });
      pose('kid', { x: 350, act: { name: 'dance' }, expr: 'excited', emote: '🎉' });
      pose('dog', { x: 470, facing: -1, expr: 'happy', emote: '🐾' });
      // The real popup, inside a frame with its own chrome.* shim.
      const base = new URL('../../', location.href).href;
      const shim = `<script>window.chrome={storage:{local:{get:async()=>({}),set:async()=>{}}},tabs:{query:async()=>[{id:1,url:'https://weekendkitchen.example/'}],sendMessage:async()=>({ok:true})}};<\/script>`;
      fetch(base + 'popup/popup.html').then(r => r.text()).then(html => {
        const f = document.createElement('iframe');
        f.className = 'popup-frame';
        f.srcdoc = html.replace('<head>', `<head><base href="${base}popup/">${shim}`);
        document.body.appendChild(f);
      });
    },
  };

  setTimeout(() => STAGE[S](), 1500);
</script>
