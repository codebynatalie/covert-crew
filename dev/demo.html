<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Covert Crew – demo page</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 30px 40px 200px; background: #f4f1ea; color: #333; }
    h1 { margin-top: 0; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 24px; }
    button { padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 140px; }
    .card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.08); height: 120px; }
    input[name=q] { padding: 6px 10px; width: 260px; border-radius: 8px; border: 1px solid #bbb; }
  </style>
</head>
<body>
  <h1>Covert Crew demo</h1>
  <p>This page fakes the Chrome extension APIs so the content script can run outside an extension.</p>
  <div class="bar">
    <input name="q" type="search" placeholder="Search… (try pizza, spy, homework, cats)" />
    <button data-cmd="gather">Gather</button>
    <button data-cmd="party">Party</button>
    <button data-cmd="wave">Say hi</button>
    <button data-cmd="sleep">Nap</button>
  </div>
  <div class="cards">
    <div class="card">Card one – the crew can jump up here.</div>
    <div class="card">Card two</div>
    <div class="card">Card three</div>
  </div>

  <script>
    // Minimal chrome.* shim for local testing.
    (function () {
      const data = {};
      const listeners = [];
      window.chrome = window.chrome || {};
      chrome.storage = {
        local: {
          get(keys, cb) { const out = {}; [].concat(keys).forEach(k => { if (k in data) out[k] = data[k]; }); cb(out); },
          set(obj, cb) {
            const changes = {};
            for (const k in obj) { changes[k] = { oldValue: data[k], newValue: obj[k] }; data[k] = obj[k]; }
            listeners.forEach(l => l(changes, 'local'));
            cb && cb();
          },
        },
        onChanged: { addListener: (l) => listeners.push(l) },
      };
      chrome.runtime = { onMessage: { addListener() {} } };
    })();
  </script>
  <script src="../content/shared.js"></script>
  <script src="../content/art.js"></script>
  <script src="../content/styles.js"></script>
  <script src="../content/engine.js"></script>
  <script>
    document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => CovertCrew.command(b.dataset.cmd));
  </script>
</body>
</html>
